services:

  # ─────────────────────────────────────────
  # Ollama — Servidor de modelos locais
  # ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: fundador_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Para GPU NVIDIA, descomente:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ─────────────────────────────────────────
  # PostgreSQL — Banco relacional
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fundador_postgres
    environment:
      POSTGRES_DB: fundador_ia
      POSTGRES_USER: fundador
      POSTGRES_PASSWORD: fundador
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schemas/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundador -d fundador_ia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Qdrant — Banco vetorial
  # ─────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: fundador_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
  postgres_data:
  qdrant_data:
