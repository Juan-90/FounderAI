services:
  ollama:
    image: ollama/ollama:latest
    container_name: founderai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    container_name: founderai-postgres
    environment:
      POSTGRES_DB: founderai
      POSTGRES_USER: founderai
      POSTGRES_PASSWORD: founderai123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: founderai-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  founderai:
    build: .
    container_name: founderai-app
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - ollama
      - postgres
      - qdrant
    stdin_open: true
    tty: true

volumes:
  ollama:
  postgres_data:
  qdrant_data: